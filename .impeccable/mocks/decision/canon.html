<!doctype html>
<html><head><meta charset="utf-8"><title>Category standard</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden;background:#fff}
.hero{height:620px;background:linear-gradient(90deg,rgba(6,40,30,.92),rgba(6,40,30,.4)),#2d6a4f;color:#fff;padding:110px 120px}
h1{font:800 58px/1.08 "Segoe UI";max-width:900px}
p{margin-top:22px;font-size:21px;max-width:640px;opacity:.9}
.meta{margin-top:26px;font:600 18px "Segoe UI"}
.cta{margin-top:34px;display:flex;gap:14px}
.cta a{padding:16px 32px;border-radius:999px;font:700 17px "Segoe UI";background:#a7f070;color:#06281e}
.cta a+a{background:transparent;border:2px solid #fff;color:#fff}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:0 120px;margin-top:-70px}
.cards div{background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:28px;height:180px;font:700 20px "Segoe UI";color:#06281e}
</style></head><body>
<div class="hero"><h1>4th International Conference on Sustainability, Innovation, and Future Technologies</h1>
<p>Sustainable Innovation: Bridging Technology and Environmental Stewardship</p>
<p class="meta">February 21st – 22nd, 2027 · Bangkok, Thailand · Hybrid</p>
<div class="cta"><a>Register Now</a><a>Submit Paper</a></div></div>
<div class="cards"><div>Scopus & Clarivate</div><div>CPD Hours</div><div>15+ Awards</div><div>Hybrid</div></div>
</body></html>
