<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1440px;height:900px;background:#E7E9EC;font-family:Arial,sans-serif;overflow:hidden}
.rail{height:18px;background:#B9BEC6;margin:0 40px}
.panel{margin:0 40px;background:#C9CED6;padding:6px;display:grid;grid-template-columns:repeat(12,1fr);gap:6px;height:760px}

.t p{font-size:20px;margin:0 0 20px;color:#AEB8D0}
.cta{grid-column:9/13;grid-row:1/2;display:flex;gap:6px}.cta a{flex:1;display:flex;align-items:end;padding:20px;font-size:24px;font-weight:700;text-decoration:none}
.cta .s{background:#F6C343;color:#16234A}.cta .r{background:#F2F4F7;color:#16234A}
.f{grid-column:9/13;grid-row:2/4;background:#16234A;color:#F2F4F7;padding:24px;font-size:20px}
