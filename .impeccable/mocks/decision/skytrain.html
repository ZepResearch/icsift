<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1440px;height:900px;background:#F4F6F3;font-family:'Bai Jamjuree',Arial,sans-serif;color:#14181A;overflow:hidden}
.top{height:72px;background:#14181A;color:#fff;display:flex;align-items:center;padding:0 48px;gap:32px;font-weight:600}
.top b{background:#0B5D3B;padding:6px 12px;border-radius:4px}
.sign{margin:48px 48px 0;background:#0B5D3B;color:#fff;border-radius:10px;padding:40px 48px;display:flex;justify-content:space-between;align-items:end}

.sign small{font-size:18px;opacity:.8;display:block;margin-bottom:16px}
.gates{display:flex;gap:16px}.gates a{background:#fff;color:#14181A;padding:22px 30px;font-size:22px;font-weight:700;border-radius:6px;text-decoration:none}
.gates a.y{background:#F2C230}
.route{position:relative;margin:64px 0 0;height:260px}
.line{position:absolute;left:0;right:0;top:80px;height:22px;background:#0B5D3B}
.vline{position:absolute;left:900px;right:0;top:150px;height:22px;background:#1E62B0}
.st{position:absolute;top:66px;width:50px;height:50px;border-radius:50%;background:#fff;border:10px solid #0B5D3B;box-sizing:border-box}
.st.next{border-color:#F2C230}
.lab{position:absolute;top:140px;font-size:18px;font-weight:600;width:200px}
.lab i{display:block;font-style:normal;font-size:14px;opacity:.6}
.edge{position:absolute;bottom:0;left:0;right:0;height:14px;background:#F2C230}
</style></head><body>
